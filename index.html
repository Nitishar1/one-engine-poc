<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#060a14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneEngine</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      try {
        var stored = JSON.parse(localStorage.getItem('oneengine-theme') || '{}');
        document.documentElement.dataset.theme = (stored.state && stored.state.mode) || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
